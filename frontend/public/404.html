<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Truque padrão para SPA em GitHub Pages: GitHub Pages só serve arquivos
      estáticos, então um reload direto em /mini-erp/suppliers retorna 404 (não
      existe esse arquivo). Aqui codificamos o caminho como querystring e
      redirecionamos para index.html, que decodifica e restaura a rota via
      history.replaceState antes do React montar. Ver rafgraph/spa-github-pages.
    -->
    <script>
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + segmentsToKeep).join("/") + "/?p=" +
        l.pathname.slice(1).split("/").slice(segmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
